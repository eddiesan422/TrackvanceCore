name: trackvance-core

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trackvance}:${POSTGRES_PASSWORD:?Create .env with POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trackvance}
    TRACKVANCE_STORAGE_ROOT: /var/lib/trackvance
    TRACKVANCE_STORAGE_DIR: /var/lib/trackvance
    TRACKVANCE_WEB_ORIGIN: ${TRACKVANCE_WEB_ORIGIN:-http://localhost:3000}
    DEMO_ACCESS_ENABLED: ${DEMO_ACCESS_ENABLED:-${DEMO_SEED_ENABLED:-true}}
    DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    TRACKVANCE_MAX_ROWS: ${TRACKVANCE_MAX_ROWS:-100000}
    TRACKVANCE_ACQUISITION_MAX_UPLOAD_BYTES: ${TRACKVANCE_ACQUISITION_MAX_UPLOAD_BYTES:-1073741824}
    TRACKVANCE_ACQUISITION_MAX_ROWS: ${TRACKVANCE_ACQUISITION_MAX_ROWS:-5000000}
    TRACKVANCE_ACQUISITION_MAX_OBSERVED_BYTES: ${TRACKVANCE_ACQUISITION_MAX_OBSERVED_BYTES:-2147483648}
    TRACKVANCE_ACQUISITION_BATCH_ROWS: ${TRACKVANCE_ACQUISITION_BATCH_ROWS:-5000}
    TRACKVANCE_ACQUISITION_BATCH_BYTES: ${TRACKVANCE_ACQUISITION_BATCH_BYTES:-8388608}
    TRACKVANCE_ACQUISITION_BOUNDED_FORMAT_BYTES: ${TRACKVANCE_ACQUISITION_BOUNDED_FORMAT_BYTES:-10485760}
    TRACKVANCE_ACQUISITION_BOUNDED_FORMAT_ROWS: ${TRACKVANCE_ACQUISITION_BOUNDED_FORMAT_ROWS:-100000}
    TRACKVANCE_ACQUISITION_MEMORY_BYTES: ${TRACKVANCE_ACQUISITION_MEMORY_BYTES:-268435456}
    TRACKVANCE_ACQUISITION_MIN_FREE_BYTES: ${TRACKVANCE_ACQUISITION_MIN_FREE_BYTES:-536870912}
    TRACKVANCE_ACQUISITION_TIMEOUT_SECONDS: ${TRACKVANCE_ACQUISITION_TIMEOUT_SECONDS:-1800}
    TRACKVANCE_ACQUISITION_UPLOAD_TTL_SECONDS: ${TRACKVANCE_ACQUISITION_UPLOAD_TTL_SECONDS:-86400}
    TRACKVANCE_DELIVERY_BATCH_ROWS: ${TRACKVANCE_DELIVERY_BATCH_ROWS:-1000}
    TRACKVANCE_DELIVERY_SCAN_MEMORY_BYTES: ${TRACKVANCE_DELIVERY_SCAN_MEMORY_BYTES:-268435456}
    TRACKVANCE_DELIVERY_MAX_ROWS: ${TRACKVANCE_DELIVERY_MAX_ROWS:-5000000}
    TRACKVANCE_DELIVERY_RESERVE_DISK_BYTES: ${TRACKVANCE_DELIVERY_RESERVE_DISK_BYTES:-536870912}
    TRACKVANCE_DELIVERY_SYNCHRONOUS_ROWS: ${TRACKVANCE_DELIVERY_SYNCHRONOUS_ROWS:-100000}
    TRACKVANCE_DELIVERY_PREPARATION_TIMEOUT_SECONDS: ${TRACKVANCE_DELIVERY_PREPARATION_TIMEOUT_SECONDS:-1800}
    TRACKVANCE_WORKER_MEMORY_SOFT_BYTES: ${TRACKVANCE_WORKER_MEMORY_SOFT_BYTES:-536870912}
    TRACKVANCE_TEMP_MIN_FREE_BYTES: ${TRACKVANCE_TEMP_MIN_FREE_BYTES:-536870912}
    TRACKVANCE_RUN_TIMEOUT_SECONDS: ${TRACKVANCE_RUN_TIMEOUT_SECONDS:-1800}
    TRACKVANCE_SPARK_MASTER: ${TRACKVANCE_SPARK_MASTER:-local[2]}
    TRACKVANCE_SPARK_DRIVER_MEMORY_MB: ${TRACKVANCE_SPARK_DRIVER_MEMORY_MB:-768}
    TRACKVANCE_SPARK_EXECUTOR_MEMORY_MB: ${TRACKVANCE_SPARK_EXECUTOR_MEMORY_MB:-768}
    TRACKVANCE_SPARK_EXECUTOR_CORES: ${TRACKVANCE_SPARK_EXECUTOR_CORES:-1}
    TRACKVANCE_SPARK_TOTAL_CORES: ${TRACKVANCE_SPARK_TOTAL_CORES:-2}
    TRACKVANCE_SPARK_PARTITIONS: ${TRACKVANCE_SPARK_PARTITIONS:-4}
    TRACKVANCE_SPARK_BATCH_ROWS: ${TRACKVANCE_SPARK_BATCH_ROWS:-2048}
    TRACKVANCE_SPARK_BATCH_BYTES: ${TRACKVANCE_SPARK_BATCH_BYTES:-8388608}
    TRACKVANCE_SPARK_MAX_RECORD_BYTES: ${TRACKVANCE_SPARK_MAX_RECORD_BYTES:-65536}
    TRACKVANCE_SPARK_MAX_GROUP_ROWS: ${TRACKVANCE_SPARK_MAX_GROUP_ROWS:-10000}
    TRACKVANCE_SPARK_MAX_GROUP_BYTES: ${TRACKVANCE_SPARK_MAX_GROUP_BYTES:-16777216}
    TRACKVANCE_SPARK_MAX_RESULT_BYTES: ${TRACKVANCE_SPARK_MAX_RESULT_BYTES:-16777216}
    TRACKVANCE_SPARK_MEMORY_BUDGET_BYTES: ${TRACKVANCE_SPARK_MEMORY_BUDGET_BYTES:-2147483648}
    TRACKVANCE_SCHEDULER_POLL_SECONDS: ${TRACKVANCE_SCHEDULER_POLL_SECONDS:-5}
    TRACKVANCE_SCHEDULER_BATCH_SIZE: ${TRACKVANCE_SCHEDULER_BATCH_SIZE:-100}
    TRACKVANCE_EVENT_LEASE_SECONDS: ${TRACKVANCE_EVENT_LEASE_SECONDS:-300}
    TRACKVANCE_EVENT_POLL_SECONDS: ${TRACKVANCE_EVENT_POLL_SECONDS:-1}
    PYTHONUNBUFFERED: '1'
  volumes:
    - trackvance_data:/var/lib/trackvance
  # Trackvance only starts through an explicit `docker compose up`.
  restart: "no"
  cpus: 1
  mem_limit: 1536m

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackvance}
      POSTGRES_USER: ${POSTGRES_USER:-trackvance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"
    cpus: 1
    mem_limit: 1g

  api:
    <<: *backend
    cpus: 2
    mem_limit: 2g
    command: ['python', '-m', 'uvicorn', 'trackvance.api:app', '--host', '0.0.0.0', '--port', '8000', '--no-access-log']
    environment:
      <<: *backend-env
      TRACKVANCE_PUBLIC_URL: ${TRACKVANCE_PUBLIC_URL:-${TRACKVANCE_WEB_ORIGIN:-http://localhost:3000}}
      TRACKVANCE_SSO_MICROSOFT_ENABLED: ${TRACKVANCE_SSO_MICROSOFT_ENABLED:-false}
      TRACKVANCE_SSO_MICROSOFT_CLIENT_ID: ${TRACKVANCE_SSO_MICROSOFT_CLIENT_ID:-}
      TRACKVANCE_SSO_MICROSOFT_CLIENT_SECRET: ${TRACKVANCE_SSO_MICROSOFT_CLIENT_SECRET:-}
      TRACKVANCE_SSO_MICROSOFT_TRUSTED_TENANTS: ${TRACKVANCE_SSO_MICROSOFT_TRUSTED_TENANTS:-}
      TRACKVANCE_SSO_GOOGLE_ENABLED: ${TRACKVANCE_SSO_GOOGLE_ENABLED:-false}
      TRACKVANCE_SSO_GOOGLE_CLIENT_ID: ${TRACKVANCE_SSO_GOOGLE_CLIENT_ID:-}
      TRACKVANCE_SSO_GOOGLE_CLIENT_SECRET: ${TRACKVANCE_SSO_GOOGLE_CLIENT_SECRET:-}
      TRACKVANCE_SECRETS_DIR: /var/lib/trackvance-credentials
      TRACKVANCE_SECRET_KEY_FILE: /var/lib/trackvance-keys/master.key
      TRACKVANCE_DESTINATION_SECRETS_DIR: /var/lib/trackvance-delivery-credentials
      TRACKVANCE_DESTINATION_SECRET_KEY_FILE: /var/lib/trackvance-delivery-keys/master.key
    volumes:
      - trackvance_data:/var/lib/trackvance
      - connection_credentials:/var/lib/trackvance-credentials
      - connection_keys:/var/lib/trackvance-keys
      - delivery_credentials:/var/lib/trackvance-delivery-credentials
      - delivery_keys:/var/lib/trackvance-delivery-keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  worker:
    <<: *backend
    cpus: 2
    mem_limit: 3g
    command: ['python', '-m', 'trackvance.worker']
    environment:
      <<: *backend-env
      TRACKVANCE_WORKER_LANE: DEFAULT
      TRACKVANCE_SPARK_MASTER: ${TRACKVANCE_SPARK_MASTER:-local[2]}
      TRACKVANCE_SPARK_DRIVER_MEMORY_MB: ${TRACKVANCE_SPARK_DRIVER_MEMORY_MB:-768}
      TRACKVANCE_SPARK_EXECUTOR_MEMORY_MB: ${TRACKVANCE_SPARK_EXECUTOR_MEMORY_MB:-768}
      TRACKVANCE_SPARK_PARTITIONS: ${TRACKVANCE_SPARK_PARTITIONS:-4}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "from trackvance.worker import worker_status; raise SystemExit(0 if worker_status('DEFAULT')['status'] == 'RUNNING' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  delivery-worker:
    <<: *backend
    command: ['python', '-m', 'trackvance.worker']
    environment:
      <<: *backend-env
      TRACKVANCE_WORKER_LANE: DELIVERY
      TRACKVANCE_DESTINATION_SECRETS_DIR: /var/lib/trackvance-delivery-credentials
      TRACKVANCE_DESTINATION_SECRET_KEY_FILE: /var/lib/trackvance-delivery-keys/master.key
    volumes:
      - trackvance_data:/var/lib/trackvance
      - delivery_credentials:/var/lib/trackvance-delivery-credentials
      - delivery_keys:/var/lib/trackvance-delivery-keys
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "from trackvance.worker import worker_status; raise SystemExit(0 if worker_status('DELIVERY')['status'] == 'RUNNING' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  acquisition-worker:
    <<: *backend
    command: ['python', '-m', 'trackvance.acquisition_worker']
    environment:
      <<: *backend-env
      TRACKVANCE_WORKER_LANE: ACQUISITION
      TRACKVANCE_SECRETS_DIR: /var/lib/trackvance-credentials
      TRACKVANCE_SECRET_KEY_FILE: /var/lib/trackvance-keys/master.key
    volumes:
      - trackvance_data:/var/lib/trackvance
      - connection_credentials:/var/lib/trackvance-credentials
      - connection_keys:/var/lib/trackvance-keys
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "from trackvance.worker import worker_status; raise SystemExit(0 if worker_status('ACQUISITION')['status'] == 'RUNNING' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  scheduler:
    <<: *backend
    cpus: 0.25
    mem_limit: 512m
    command: ['python', '-m', 'trackvance.dispatcher']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "from trackvance.component_health import component_status; raise SystemExit(0 if component_status('scheduler') == 'RUNNING' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  events-notifications:
    <<: *backend
    cpus: 0.25
    mem_limit: 512m
    command: ['python', '-m', 'trackvance.events']
    environment:
      <<: *backend-env
      TRACKVANCE_EVENT_CONSUMER: NOTIFICATIONS
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "from trackvance.component_health import component_status; raise SystemExit(0 if component_status('events-notifications') == 'RUNNING' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  events-chaining:
    <<: *backend
    cpus: 0.25
    mem_limit: 512m
    command: ['python', '-m', 'trackvance.events']
    environment:
      <<: *backend-env
      TRACKVANCE_EVENT_CONSUMER: CHAINING
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "from trackvance.component_health import component_status; raise SystemExit(0 if component_status('events-chaining') == 'RUNNING' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  web:
    cpus: 0.5
    mem_limit: 256m
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 15s
      timeout: 3s
      retries: 5
    restart: "no"

volumes:
  postgres_data:
  trackvance_data:
  connection_credentials:
  connection_keys:
  delivery_credentials:
  delivery_keys:
