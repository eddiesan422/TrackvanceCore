name: trackvance-core

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trackvance}:${POSTGRES_PASSWORD:?Create .env with POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trackvance}
    TRACKVANCE_STORAGE_ROOT: /var/lib/trackvance
    TRACKVANCE_STORAGE_DIR: /var/lib/trackvance
    TRACKVANCE_WEB_ORIGIN: ${TRACKVANCE_WEB_ORIGIN:-http://localhost:3000}
    DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    TRACKVANCE_MAX_ROWS: ${TRACKVANCE_MAX_ROWS:-100000}
    PYTHONUNBUFFERED: '1'
  volumes:
    - trackvance_data:/var/lib/trackvance
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackvance}
      POSTGRES_USER: ${POSTGRES_USER:-trackvance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ['python', '-m', 'uvicorn', 'trackvance.api:app', '--host', '0.0.0.0', '--port', '8000']
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  worker:
    <<: *backend
    command: ['python', '-m', 'trackvance.worker']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "from trackvance.worker import worker_status; raise SystemExit(0 if worker_status()['status'] == 'RUNNING' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  web:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  trackvance_data:
