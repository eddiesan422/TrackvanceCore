[project]
name = "trackvance-core"
version = "0.5.0"
description = "Trackvance Core local prototype API and processing worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "polars>=1.30,<2",
  "python-multipart>=0.0.20",
  "argon2-cffi>=23.1",
  "psycopg[binary]>=3.2,<4",
  "pymssql>=2.3.13,<3",
  "cryptography>=46,<51",
  "alembic>=1.15,<2",
  "openpyxl>=3.1.5",
  "duckdb>=1.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=2.3.1",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackvance"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI intentionally declares dependency/parameter metadata in default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
