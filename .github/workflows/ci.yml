name: Trackvance CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Complete functional regression. Intensive deep certification runs locally.
        type: choice
        options: [functional]
        default: functional
      cache_mode:
        description: Cold disables cache restoration; warm reuses dependencies and layers.
        type: choice
        options: [warm, cold]
        default: warm
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  # A duplicate push must never cancel the authoritative PR regression.
  # Ordinary older runs of each branch/event are cancelled as a whole.
  group: trackvance-ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || format('{0}-{1}', github.event_name, github.head_ref || github.ref_name) }}
  cancel-in-progress: true
env:
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_PROFILE: functional
  CI_BRANCH: ${{ github.head_ref || github.ref_name }}
  CI_CACHE_MODE: ${{ inputs.cache_mode || (github.run_attempt == 1 && contains(github.event.head_commit.message, '[ci cold]') && 'cold' || 'warm') }}
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.duplicate.outputs.run }}
      mode: ${{ steps.select.outputs.mode }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          fetch-depth: 0
      - name: Avoid duplicate push and PR validation of the same commit
        id: duplicate
        uses: actions/github-script@v8
        with:
          script: |
            let run = true;
            if (context.eventName === 'push') {
              const prs = await github.paginate(github.rest.pulls.list, {
                ...context.repo, state: 'open',
                head: context.repo.owner + ':' + context.ref.replace('refs/heads/', '')
              });
              run = !prs.some(pr => pr.head.sha === context.sha);
            }
            core.setOutput('run', String(run));
      - name: Select complete functional coverage or documentation validation
        id: select
        if: steps.duplicate.outputs.run == 'true'
        env:
          REQUESTED_PROFILE: ${{ inputs.profile || 'auto' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/select_suites.py --profile "$REQUESTED_PROFILE" --base "$BASE_SHA" \
            --head "$CI_SOURCE_SHA" --event "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" --branch "$CI_BRANCH" \
            --commit-message "$COMMIT_MESSAGE" --cache-mode "$CI_CACHE_MODE" \
            --output .codex-local/ci/selection.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.duplicate.outputs.run == 'true'
        with:
          name: ci-selection-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci/selection.json
          include-hidden-files: true
          if-no-files-found: error

  documentation:
    if: needs.select.outputs.run == 'true' && needs.select.outputs.mode == 'docs'
    needs: [select]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/download-artifact@v8
        with:
          name: ci-selection-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci
      - name: Validate changed documents and local links without product setup
        run: |
          python scripts/ci/check_documentation.py --selection .codex-local/ci/selection.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output .codex-local/ci/documentation-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-documentation-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci/documentation-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  backend:
    if: needs.select.outputs.run == 'true' && needs.select.outputs.mode == 'functional'
    needs: [select]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trackvance_ci
          POSTGRES_USER: trackvance_ci
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trackvance_ci -d trackvance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_JOB_ID: backend
      CI_MIGRATION_DATABASE_URL: postgresql+psycopg://trackvance_ci:disposable-ci-password@127.0.0.1:5432/trackvance_ci
      TRACKVANCE_SPARK_TESTS: '1'
      TRACKVANCE_SPARK_MASTER: local[2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - name: Pin Java for real Spark parity and publication
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.17+10'
          check-latest: false
      - uses: ./.github/actions/dependencies
        with:
          python: 'true'
          cache-mode: ${{ env.CI_CACHE_MODE }}
      - name: Install syscall verification tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y strace libseccomp2
      - name: Run all existing backend checks
        run: python scripts/ci/run_suite.py --profile functional --group backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-evidence-backend-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            .codex-local/ci/evidence/**/*.json
            .codex-local/ci/evidence/**/*.xml
            .codex-local/ci/diagnostics/**/*.json
            .codex-local/ci/image-load.json
            .codex-local/v070/trackvance-v070-test-corrections-*/xlsx-scenarios-*/**/*.json
            .codex-local/v070/trackvance-v070-test-corrections-*/corrections-evidence.json
          include-hidden-files: true
          if-no-files-found: error

  frontend:
    if: needs.select.outputs.run == 'true' && needs.select.outputs.mode == 'functional'
    needs: [select, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_JOB_ID: frontend
      TRACKVANCE_CI_FRONTEND_BUILD_PROOF_MANIFEST: ${{ github.workspace }}/.codex-local/ci/frontend-proof/images.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: ./.github/actions/dependencies
        with:
          frontend: 'true'
          cache-mode: ${{ env.CI_CACHE_MODE }}
      - uses: actions/download-artifact@v8
        with:
          name: ci-frontend-proof-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci/frontend-proof
      - name: Run all existing frontend checks
        run: python scripts/ci/run_suite.py --profile functional --group frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-evidence-frontend-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            .codex-local/ci/evidence/**/*.json
            .codex-local/ci/evidence/**/*.xml
            .codex-local/ci/diagnostics/**/*.json
            .codex-local/ci/image-load.json
            .codex-local/v070/trackvance-v070-test-corrections-*/xlsx-scenarios-*/**/*.json
            .codex-local/v070/trackvance-v070-test-corrections-*/corrections-evidence.json
          include-hidden-files: true
          if-no-files-found: error

  images:
    if: needs.select.outputs.run == 'true' && needs.select.outputs.mode == 'functional'
    needs: [select]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: docker/setup-buildx-action@v4
      - name: Build locked backend once for this commit
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: trackvance-ci:backend
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ env.CI_SOURCE_SHA }}
            org.opencontainers.image.version=0.8.5
          no-cache: ${{ env.CI_CACHE_MODE == 'cold' }}
          cache-from: ${{ env.CI_CACHE_MODE == 'warm' && 'type=gha,scope=trackvance-backend-linux-amd64-v1' || '' }}
          cache-to: type=gha,scope=trackvance-backend-linux-amd64-v1,mode=max
      - name: Build locked web once for this commit
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          load: true
          tags: trackvance-ci:web
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ env.CI_SOURCE_SHA }}
            org.opencontainers.image.version=0.8.5
          no-cache: ${{ env.CI_CACHE_MODE == 'cold' }}
          cache-from: ${{ env.CI_CACHE_MODE == 'warm' && 'type=gha,scope=trackvance-web-linux-amd64-v1' || '' }}
          cache-to: type=gha,scope=trackvance-web-linux-amd64-v1,mode=max
      - name: Export source and assets from the same cached frontend build stage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          target: build
          load: true
          tags: trackvance-ci:frontend-build
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ env.CI_SOURCE_SHA }}
            org.opencontainers.image.version=0.8.5
      - name: Export immutable images and byte hashes without application state
        run: |
          python scripts/ci/image_bundle.py export --sha "$CI_SOURCE_SHA" --directory .codex-local/ci/images \
            --frontend-build trackvance-ci:frontend-build
      - uses: actions/upload-artifact@v7
        with:
          name: ci-images-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci/images
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: ci-image-proof-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci/images/images.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ci-frontend-proof-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            .codex-local/ci/images/images.json
            .codex-local/ci/images/frontend-build-proof.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  suites:
    name: ${{ matrix.job_key }}
    if: needs.select.outputs.run == 'true' && needs.select.outputs.mode == 'functional'
    needs: [select, images]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      CI_JOB_ID: suite-${{ matrix.group }}
      PLAYWRIGHT_CHANNEL: chromium
      TRACKVANCE_CERTIFICATION_USE_ISOLATED_IMAGES: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/dependencies
        with:
          python: ${{ matrix.python && 'true' || 'false' }}
          frontend: ${{ matrix.browser && 'true' || 'false' }}
          browser: ${{ matrix.browser && 'true' || 'false' }}
          cache-mode: ${{ env.CI_CACHE_MODE }}
      - name: Start image transfer measurement
        run: |
          mkdir -p .codex-local/ci
          date +%s.%N > .codex-local/ci/image-transfer-start.txt
      - uses: actions/download-artifact@v8
        with:
          name: ci-images-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci/images
      - name: Verify archive bytes, revision and digests before using images
        run: |
          python scripts/ci/image_bundle.py load --sha "$CI_SOURCE_SHA" \
            --directory .codex-local/ci/images --output .codex-local/ci/image-load.json
          echo "TRACKVANCE_CI_IMAGE_MANIFEST=$GITHUB_WORKSPACE/.codex-local/ci/images/images.json" >> "$GITHUB_ENV"
      - name: Run exact selected group
        env:
          CI_GROUP: ${{ matrix.group }}
        run: python scripts/ci/run_suite.py --profile functional --group "$CI_GROUP"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-evidence-${{ matrix.group }}-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            .codex-local/ci/evidence/**/*.json
            .codex-local/ci/evidence/**/*.xml
            .codex-local/ci/diagnostics/**/*.json
            .codex-local/ci/image-load.json
            .codex-local/v070/trackvance-v070-test-corrections-*/xlsx-scenarios-*/**/*.json
            .codex-local/v070/trackvance-v070-test-corrections-*/corrections-evidence.json
          include-hidden-files: true
          if-no-files-found: error

  gate:
    # Keep this required check name stable, including docs-only and failed selection.
    if: always()
    needs: [select, documentation, backend, frontend, images, suites]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject missing, failed or cancelled selection
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          SELECT_RUN: ${{ needs.select.outputs.run }}
        run: |
          test "$SELECT_RESULT" = success
          test "$SELECT_RUN" = true -o "$SELECT_RUN" = false
      - name: Record duplicate push deferred to the authoritative PR check
        if: needs.select.outputs.run == 'false'
        run: echo 'Duplicate push; the same SHA is validated by the pull request workflow. This run grants no functional or deep approval.'
      - uses: actions/checkout@v7
        if: needs.select.outputs.run == 'true'
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: needs.select.outputs.run == 'true' && needs.select.outputs.mode == 'functional'
        with:
          pattern: ci-evidence-*-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci/downloaded
      - uses: actions/download-artifact@v8
        if: needs.select.outputs.run == 'true'
        with:
          name: ci-selection-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci
      - uses: actions/download-artifact@v8
        if: needs.select.outputs.run == 'true' && needs.select.outputs.mode == 'functional'
        with:
          name: ci-image-proof-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci/images
      - uses: actions/download-artifact@v8
        if: needs.select.outputs.run == 'true' && needs.select.outputs.mode == 'docs'
        with:
          name: ci-documentation-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: .codex-local/ci
      - name: Validate groups, scenario contents, hashes, SHA and run identity
        if: needs.select.outputs.run == 'true'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_MODE: ${{ needs.select.outputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('.codex-local/ci/jobs.json').write_text(json.dumps({
            'source_sha': os.environ['CI_SOURCE_SHA'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'needs': json.loads(os.environ['NEEDS_JSON'])}))
          PY
          extra=()
          if [ "$SELECTED_MODE" = docs ]; then extra+=(--documentation-evidence .codex-local/ci/documentation-result.json); fi
          python scripts/ci/final_gate.py --manifest scripts/ci/scenarios.json \
            --selection .codex-local/ci/selection.json --evidence-dir .codex-local/ci/downloaded \
            --jobs .codex-local/ci/jobs.json --sha "$CI_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --image-manifest .codex-local/ci/images/images.json \
            --output .codex-local/ci/gate-result.json "${extra[@]}"
      - uses: actions/upload-artifact@v7
        if: always() && needs.select.outputs.run == 'true'
        with:
          name: ci-gate-${{ env.CI_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            .codex-local/ci/gate-result.json
            .codex-local/ci/jobs.json
            .codex-local/ci/selection.json
          include-hidden-files: true
          if-no-files-found: error
