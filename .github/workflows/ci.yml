name: Trackvance local checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trackvance_ci
          POSTGRES_USER: trackvance_ci
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackvance_ci -d trackvance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package manager
        run: python -m pip install uv
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install Linux syscall verification tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y strace libseccomp2
      - name: Test processing and API
        working-directory: backend
        run: uv run pytest tests ../scripts/tests
      - name: Check Python code
        working-directory: backend
        run: uv run ruff check src tests ../scripts
      - name: Check Python types
        working-directory: backend
        run: uv run mypy src/trackvance --check-untyped-defs --ignore-missing-imports
      - name: Verify generated HTTP, model and permission contracts
        working-directory: backend
        run: |
          uv run python ../scripts/export_contracts.py
          git diff --exit-code -- openapi.json ../docs/specification/model_contract_0.8.0.json ../docs/specification/permission_contract_0.8.0.json ../docs/development/permission-matrix.md
      - name: Verify PostgreSQL migration round trip on disposable database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://trackvance_ci:disposable-ci-password@127.0.0.1:5432/trackvance_ci
          DEMO_SEED_ENABLED: 'false'
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python ../scripts/check_postgres_migrations.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Type check
        working-directory: frontend
        run: pnpm typecheck
      - name: Component tests
        working-directory: frontend
        run: pnpm test
      - name: Production build
        working-directory: frontend
        run: pnpm build
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend, frontend]
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - name: Install locked frontend and browser dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify demo access without seed in a fresh guarded project
        run: python scripts/tests/docker_e2e_cycle.py --clean-demo
      - name: Verify all browser flows, restart persistence and migration history
        run: python scripts/tests/docker_e2e_cycle.py
      - name: Upload sanitized browser, persistence and migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            .codex-local/v070/trackvance-v070-test-e2e-*/result.json
            .codex-local/v070/trackvance-v070-test-e2e-*/browser-summary.json
            .codex-local/v070/trackvance-v070-test-e2e-*/before.json
            .codex-local/v070/trackvance-v070-test-e2e-*/after.json
            .codex-local/v070/trackvance-v070-test-e2e-*/migrations.json
          include-hidden-files: true
          if-no-files-found: ignore
  xlsx-corrections-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [backend, frontend]
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: npm install --global pnpm@11.19.0
      - name: Install locked browser dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Certify real XLSX boundaries, 400k and 1M with normal runtime limits
        run: python scripts/tests/corrections_cycle.py --with-browser --with-recovery --with-native-recovery --with-dispatch
      - name: Upload complete safe correction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xlsx-corrections-results
          path: |
            .codex-local/v070/trackvance-v070-test-corrections-*/corrections-evidence.json
            .codex-local/v070/trackvance-v070-test-corrections-*/dispatch-results.json
            .codex-local/v070/trackvance-v070-test-corrections-*/browser-summary.json
            .codex-local/v070/trackvance-v070-test-corrections-*/corrections-native-recovery-*/result.json
          include-hidden-files: true
          if-no-files-found: error
  identity-sso-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - name: Install browser certification dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: One-time credentials, dynamic RBAC and signed mock OIDC browser flows
        run: python scripts/tests/identity_sso_cycle.py
      - name: Upload sanitized identity certification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: identity-sso-evidence
          path: .codex-local/v070/trackvance-v070-test-identity-*/result.json
          include-hidden-files: true
          if-no-files-found: ignore
  connections-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Real PostgreSQL and SQL Server certification
        run: python scripts/tests/connections_cycle.py --full-playwright
      - name: Upload source certification and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connections-evidence
          path: |
            .codex-local/connections-e2e/**/result.json
            .codex-local/connections-e2e/**/browser-summary.json
            .codex-local/connections-e2e/**/runtime-diagnostics.json
          include-hidden-files: true
          if-no-files-found: ignore
  delivery-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend, frontend]
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Real PostgreSQL and SQL Server Data Delivery certification
        run: python scripts/tests/delivery_cycle.py
      - name: Upload sanitized Delivery and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-evidence
          path: |
            .codex-local/delivery-e2e/**/result.json
            .codex-local/delivery-e2e/**/browser-summary.json
            .codex-local/delivery-e2e/**/runtime-diagnostics.json
          include-hidden-files: true
          if-no-files-found: ignore
  backup-restore-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build isolated recovery target images
        run: |
          docker build -t trackvance-v070-isolated:backend -f backend/Dockerfile .
          docker build -t trackvance-v070-isolated:web -f deploy/docker/frontend.Dockerfile .
      - name: Restore PostgreSQL, artifacts and source credentials into a fresh project
        run: python scripts/tests/docker_backup_cycle.py
      - name: Restore an authentic 0.5.1 backup into 0.8.0
        run: python scripts/tests/identity_legacy_restore_cycle.py --source-version 0.5.1
      - name: Preserve notification history from an authentic 0.6.0 backup
        run: python scripts/tests/identity_legacy_restore_cycle.py --source-version 0.6.0
      - name: Restore the authentic 0.6.1 baseline with strict legacy preservation
        run: python scripts/tests/identity_legacy_restore_cycle.py --source-version 0.6.1
      - name: Upload sanitized recovery results only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-results
          path: |
            .codex-local/recovery/**/result.json
            .codex-local/v070/**/result.json
          include-hidden-files: true
          if-no-files-found: ignore
  catalog-reports-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [backend, frontend]
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - name: Install locked browser dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Certify Catalog, frozen reports and complete 400k and 1M populations
        run: python scripts/tests/catalog_reports_cycle.py --rows 120 400000 1000000 --main-project trackvance-ci-protected --with-browser --with-recovery
      - name: Upload sanitized catalog and report certification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-reports-results
          path: |
            .codex-local/v080/trackvance-v080-test-catalog-reports-*/result.json
            .codex-local/v080/trackvance-v080-test-catalog-reports-*/reports-*.json
            .codex-local/v080/trackvance-v080-test-catalog-reports-*/browser-summary.json
            .codex-local/v080/trackvance-v080-test-catalog-reports-*/browser-screenshots/*.png
            .codex-local/v080/trackvance-v080-test-catalog-reports-*/catalog-recovery-*/result.json
          include-hidden-files: true
          if-no-files-found: error
  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exercise the benchmark harness at bounded smoke volume
        run: python scripts/tests/benchmark_cycle.py --target-mib 1 --rows 1000 --file-only --max-wall-seconds 600
      - name: Upload measured smoke results (not volume certification)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-smoke-results
          path: |
            .codex-local/benchmarks/**/result.json
            .codex-local/benchmarks/**/cleanup.json
          include-hidden-files: true
          if-no-files-found: ignore
  delivery-benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Measure all four Delivery strategies on real disposable targets
        run: python scripts/tests/delivery_benchmark_cycle.py --smoke --max-wall-seconds 1200
      - name: Upload sanitized measurements (not production capacity certification)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-benchmark-smoke-results
          path: .codex-local/delivery-benchmarks/**/result.json
          include-hidden-files: true
          if-no-files-found: ignore
  spark-local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the locked isolated Java and PySpark runtime
        run: docker build --tag trackvance-v070-isolated:backend --file backend/Dockerfile .
      - name: Real JVM parity and all three modules at one million records
        run: python scripts/tests/spark_local_docker_cycle.py --evidence .codex-local/v070/spark/ci-local --rows 1000000
      - name: Upload sanitized Spark local results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-local-results
          path: |
            .codex-local/v070/spark/ci-local/*summary.json
            .codex-local/v070/spark/ci-local/*evidence.json
            .codex-local/v070/spark/ci-local/parity.xml
          include-hidden-files: true
          if-no-files-found: ignore
  spark-standalone-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the same locked driver and executor runtime
        run: docker build --tag trackvance-v070-isolated:backend --file backend/Dockerfile .
      - name: Real driver, two executors, parity and one million records
        run: python scripts/tests/spark_docker_cycle.py --evidence .codex-local/v070/spark/ci-standalone --rows 1000000
      - name: Upload sanitized Spark Standalone results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-standalone-results
          path: |
            .codex-local/v070/spark/ci-standalone/*summary.json
            .codex-local/v070/spark/ci-standalone/*evidence.json
            .codex-local/v070/spark/ci-standalone/parity.xml
          include-hidden-files: true
          if-no-files-found: ignore
  async-volume-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        tier-mib: [100, 500, 1024]
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: npm install --global pnpm@11.19.0
      - name: Install locked fixture and browser dependencies
        run: |
          uv sync --project backend --frozen
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: One million records across CSV, JSONL and Parquet with exact SQL output
        run: |
          extra=()
          if [ '${{ matrix.tier-mib }}' = '100' ]; then
            extra+=(--with-browser --with-recovery)
          fi
          uv run --project backend python scripts/tests/v070_cycle.py --tier-mib '${{ matrix.tier-mib }}' "${extra[@]}"
      - name: Upload safe aggregates without env, database dumps or raw browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: async-volume-${{ matrix.tier-mib }}-results
          path: |
            .codex-local/v070/**/cycle-summary.json
            .codex-local/v070/**/volume-evidence.json
            .codex-local/v070/**/automation-results.json
            .codex-local/v070/**/browser-summary.json
            .codex-local/v070/**/browser-volume-integrity.json
            .codex-local/v070/**/result.json
          include-hidden-files: true
          if-no-files-found: ignore
