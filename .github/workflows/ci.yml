name: Trackvance local checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trackvance_ci
          POSTGRES_USER: trackvance_ci
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackvance_ci -d trackvance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package manager
        run: python -m pip install uv
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Test processing and API
        working-directory: backend
        run: uv run pytest tests ../scripts/tests
      - name: Check Python code
        working-directory: backend
        run: uv run ruff check src tests ../scripts
      - name: Check Python types
        working-directory: backend
        run: uv run mypy src/trackvance --check-untyped-defs --ignore-missing-imports
      - name: Verify PostgreSQL migration round trip on disposable database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://trackvance_ci:disposable-ci-password@127.0.0.1:5432/trackvance_ci
          DEMO_SEED_ENABLED: 'false'
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python ../scripts/check_postgres_migrations.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Type check
        working-directory: frontend
        run: pnpm typecheck
      - name: Component tests
        working-directory: frontend
        run: pnpm test
      - name: Production build
        working-directory: frontend
        run: pnpm build
  compose-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: trackvance-ci
      POSTGRES_PASSWORD: disposable-compose-password
      WEB_PORT: '3100'
      TRACKVANCE_WEB_ORIGIN: http://localhost:3100
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - name: Install frontend test dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated local stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Readiness and worker
        run: python scripts/doctor.py --base-url http://localhost:3100 --docker
      - name: API smoke
        run: python scripts/smoke_test.py --base-url http://localhost:3100
      - name: Browser flows and Excel downloads
        working-directory: frontend
        run: pnpm test:e2e
      - name: Restart with retained volumes
        run: |
          docker compose restart
          docker compose up --detach --wait --wait-timeout 120
          python scripts/doctor.py --base-url http://localhost:3100 --docker
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop isolated stack without deleting volumes
        if: always()
        run: docker compose down
