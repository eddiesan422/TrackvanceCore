# Independent GPU identity; never merge into the permanent Codex compose stack.
# Download models first: python scripts/idp_models.py --destination <private-cache>
# Prepare scripts/idp_runtime.py, then use its private runtime.env with --env-file.
name: trackvance-idp098
services:
  idp-ollama:
    image: ollama/ollama@sha256:ca389885d4c03971d9bdc1c082452c128819b48425b5633c73d7b208b1e3d11a
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 3
    mem_limit: 6g
    pids_limit: 128
    environment:
      HOME: /tmp
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NOPRUNE: "true"
      OLLAMA_GPU_OVERHEAD: "1610612736"
    volumes:
      - ${IDP_MODEL_ROOT:?Set private model cache}/ollama:/models:ro
    tmpfs: ["/tmp:size=128m,mode=1777", "/models/manifests-v2:size=16m,mode=1777"]
    networks: [inference]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
  idp-gateway:
    image: ${IDP_PADDLE_IMAGE:?Build the verified private runtime first}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 3
    mem_limit: 6g
    pids_limit: 192
    shm_size: 256m
    entrypoint: [/opt/venv/bin/python, -I, -B, /app/server.py]
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
      PADDLE_HOME: /tmp/paddle
      PADDLE_PDX_CACHE_HOME: /tmp/paddlex
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      FLAGS_allocator_strategy: auto_growth
      FLAGS_gpu_memory_limit_mb: "10000"
      TRACKVANCE_IDP_STACK_DIAGNOSTICS: "${IDP_STACK_DIAGNOSTICS:-0}"
    volumes:
      - ${IDP_MODEL_ROOT:?Set private model cache}/paddle:/models/paddle:ro
      - ${IDP_MODEL_ROOT:?Set private model cache}/layout:/models/layout:ro
      - idp-runtime:/opt/venv:ro
    tmpfs: ["/tmp:size=768m,mode=1777"]
    networks: [inference]
    depends_on: [idp-ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
  idp-ingress:
    image: python@sha256:57d96f71de145a98e7ceca18ee4ade77bba4103a33a72dfaea026b23625c6bf0
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 48
    entrypoint: [python, -I, -B, /app/ingress.py]
    volumes:
      - ./deploy/idp/ingress.py:/app/ingress.py:ro
    networks: [inference, ingress]
    ports: ["127.0.0.1:${IDP_LOCAL_PORT:-3288}:8088"]
    depends_on: [idp-gateway]
networks:
  inference:
    internal: true
  ingress: {}
volumes:
  idp-runtime:
    external: true
    name: ${IDP_RUNTIME_VOLUME:?Initialize the verified private runtime volume first}
